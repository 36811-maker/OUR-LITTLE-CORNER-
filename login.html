<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OUR LITTLE CORNER ♡ - Entrar</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-page">
  <!-- Elementos Flutuantes de Fundo -->
  <span class="bg-decor bg-decor-1">🌸</span>
  <span class="bg-decor bg-decor-2">💌</span>
  <span class="bg-decor bg-decor-3">✨</span>
  <span class="bg-decor bg-decor-4">🧸</span>

  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">🌸</div>
      <h1 class="login-title">OUR LITTLE CORNER</h1>
      <p class="login-subtitle">o nosso cantinho particular de amor ♡</p>
    </div>

    <!-- Indicador do Status de Contas Registradas -->
    <div class="login-corner-status" id="corner-status-box">
      <span id="corner-status-text">Verificando cantinho...</span>
    </div>

    <!-- Abas de Navegação -->
    <div class="login-tabs">
      <button type="button" class="login-tab-btn active" id="tab-btn-login">Entrar</button>
      <button type="button" class="login-tab-btn" id="tab-btn-register">Criar Conta</button>
      <button type="button" class="login-tab-btn" id="tab-btn-reset">Recuperar</button>
    </div>

    <!-- 1. FORMULÁRIO DE LOGIN -->
    <form id="form-login">
      <div class="form-group">
        <label class="form-label" for="login-email">Seu E-mail:</label>
        <input type="email" id="login-email" class="olc-input" required placeholder="seu-email@exemplo.com" autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label" for="login-password">Sua Senha:</label>
        <div class="input-password-wrapper">
          <input type="password" id="login-password" class="olc-input" required placeholder="••••••••" autocomplete="current-password">
          <button type="button" class="toggle-password-btn" data-target="login-password" title="Mostrar/ocultar senha">👁️</button>
        </div>
      </div>

      <button type="submit" class="olc-btn olc-btn-primary" style="width: 100%; margin-top: 8px;">
        Entrar no Nosso Cantinho ♡
      </button>

      <div class="login-extra-links">
        <a href="#" id="link-forgot-password">Esqueceu sua senha?</a>
      </div>

      <div style="margin-top: 20px; padding-top: 16px; border-top: 1px dashed var(--border-color); display: flex; flex-direction: column; gap: 10px; align-items: center;">
        <button type="button" class="olc-btn olc-btn-outline" id="btn-quick-demo" style="width: 100%; font-size: 0.88rem; padding: 9px 16px; border-color: var(--color-primary); background: #FFF9FA;">
          ⚡ Acesso Rápido de Teste (Dengo & Amor) ♡
        </button>
        <a href="#" id="link-setup-supabase" style="font-size: 0.8rem; color: var(--color-text-muted); text-decoration: none;">
          ☁️ Conectar Supabase em Nuvem (Opcional)
        </a>
      </div>
    </form>

    <!-- 2. FORMULÁRIO DE CADASTRO INICIAL (Liberado se < 2 contas) -->
    <form id="form-register" style="display: none;">
      <div class="form-group">
        <label class="form-label" for="reg-display-name">Como seu amor te chama? (Nome de exibição)</label>
        <input type="text" id="reg-display-name" class="olc-input" required placeholder="Ex: Meu Amor, Dengo, Mari, Pedro">
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-username">Nome de usuário (sem espaços):</label>
        <input type="text" id="reg-username" class="olc-input" required placeholder="ex: mari, dengo, pedro" pattern="[a-zA-Z0-9_-]+" title="Apenas letras, números e hífens">
      </div>

      <div class="form-group">
        <label class="form-label">Escolha um avatar fofinho:</label>
        <div class="avatar-preset-grid">
          <button type="button" class="avatar-preset-item selected" data-avatar="🌸">🌸</button>
          <button type="button" class="avatar-preset-item" data-avatar="🧸">🧸</button>
          <button type="button" class="avatar-preset-item" data-avatar="🐱">🐱</button>
          <button type="button" class="avatar-preset-item" data-avatar="🍓">🍓</button>
          <button type="button" class="avatar-preset-item" data-avatar="☕">☕</button>
          <button type="button" class="avatar-preset-item" data-avatar="🌙">🌙</button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-email">Seu e-mail permanente:</label>
        <input type="email" id="reg-email" class="olc-input" required placeholder="seu-email@exemplo.com" autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-password">Sua senha secreta:</label>
        <div class="input-password-wrapper">
          <input type="password" id="reg-password" class="olc-input" required minlength="6" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
          <button type="button" class="toggle-password-btn" data-target="reg-password">👁️</button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-confirm-password">Confirme sua senha:</label>
        <div class="input-password-wrapper">
          <input type="password" id="reg-confirm-password" class="olc-input" required minlength="6" placeholder="Digite a mesma senha" autocomplete="new-password">
          <button type="button" class="toggle-password-btn" data-target="reg-confirm-password">👁️</button>
        </div>
      </div>

      <button type="submit" class="olc-btn olc-btn-primary" style="width: 100%; margin-top: 8px;">
        Criar Minha Conta no Cantinho ♡
      </button>
    </form>

    <!-- 3. FORMULÁRIO DE RECUPERAÇÃO DE SENHA -->
    <form id="form-reset" style="display: none;">
      <p style="font-size: 0.88rem; color: var(--color-text-muted); margin-bottom: 16px; line-height: 1.5;">
        Digite o e-mail cadastrado na sua conta. Você receberá um link seguro do Supabase para redefinir sua senha.
      </p>

      <div class="form-group">
        <label class="form-label" for="reset-email">Seu E-mail Cadastrado:</label>
        <input type="email" id="reset-email" class="olc-input" required placeholder="seu-email@exemplo.com">
      </div>

      <button type="submit" class="olc-btn olc-btn-primary" style="width: 100%; margin-top: 8px;">
        Enviar Instruções de Recuperação
      </button>
    </form>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
